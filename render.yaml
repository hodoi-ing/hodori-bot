services:
  - type: worker
    name: hodori-bot
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: python discord_interactive_bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
